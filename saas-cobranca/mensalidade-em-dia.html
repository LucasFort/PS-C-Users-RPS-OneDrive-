<title>Mensalidade em Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: app em coluna única no celular (abas embaixo); no computador vira painel com menu lateral e colunas. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --ink:#15211A; --muted:#5D6A62; --line:#DAE2DB;
  --accent:#1E7449; --accent-ink:#FFFFFF; --accent-soft:#E2F0E7; --alt:#9AA7A0;
  --ok:#1C8350; --ok-bg:#E0F2E7; --warn:#A66A12; --warn-bg:#FBF0DA; --bad:#BC3B28; --bad-bg:#FBE5E0;
  --chat:#E9E3D9; --bubble:#D9F7C8; --bubble-ink:#14201A; --qr:#FFFFFF; --shade:rgba(10,20,14,.45);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --side:228px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16201A; --ink:#E5ECE7; --muted:#93A198; --line:#26332B;
  --accent:#4FC68C; --accent-ink:#08170F; --accent-soft:#183326; --alt:#4A5A51;
  --ok:#55CC8F; --ok-bg:#163423; --warn:#E6B350; --warn-bg:#352A12; --bad:#F27D66; --bad-bg:#3A1C16;
  --chat:#0B141A; --bubble:#1D4A37; --bubble-ink:#E8F2EC; --qr:#FFFFFF; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16201A; --ink:#E5ECE7; --muted:#93A198; --line:#26332B;
  --accent:#4FC68C; --accent-ink:#08170F; --accent-soft:#183326; --alt:#4A5A51;
  --ok:#55CC8F; --ok-bg:#163423; --warn:#E6B350; --warn-bg:#352A12; --bad:#F27D66; --bad-bg:#3A1C16;
  --chat:#0B141A; --bubble:#1D4A37; --bubble-ink:#E8F2EC; --qr:#FFFFFF; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:11px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand strong{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:5px 9px;border-radius:999px;border:0}

main.wrap{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:800}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.cols,.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.score{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.score .eyebrow{color:inherit;opacity:.8}
.score .big{font-family:var(--f-display);font-stretch:75%;font-weight:900;font-size:44px;line-height:1}
.score .of{opacity:.85;font-weight:600}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:999px;transition:width .4s}
.meter{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.four{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:12px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)} .tile.ok b{color:var(--ok)}

.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0;font-size:14px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;text-decoration:none}
.row:first-child{border-top:0}
button.row:hover{background:var(--bg)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.avatar.sq{border-radius:10px}
.avatar.off{background:var(--bg);color:var(--muted)}
.who{flex:1;min-width:0;display:flex;flex-direction:column}
.who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.right b{font-weight:700;font-size:14px}
.chev{flex:none;color:var(--muted);font-size:20px;line-height:1}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.pago{color:var(--ok);background:var(--ok-bg)}
.pill.atrasado{color:var(--bad);background:var(--bad-bg)}
.pill.vence{color:var(--warn);background:var(--warn-bg)}
.pill.niver{color:var(--accent);background:var(--accent-soft)}
.pill.aberto,.pill.inativo{color:var(--muted);background:var(--bg)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:700;border:1px solid transparent;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.wa{background:#1FA855;color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}

.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;flex:0 1 auto;min-width:0;max-width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Navegação: abas embaixo no celular, menu lateral no computador */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.side-brand{display:none}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;flex:none}
.tab[aria-current="page"]{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{background:var(--bg);border:0;border-radius:50%;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.chat{background:var(--chat);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat-to{font-size:12px;color:var(--muted);text-align:center}
.bubble{align-self:flex-end;max-width:92%;background:var(--bubble);color:var(--bubble-ink);border-radius:10px 2px 10px 10px;padding:9px 11px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bubble .pix{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;opacity:.85}
.qrbox{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:12px;padding:12px}
.qr{flex:none;background:var(--qr);padding:8px;border-radius:8px;width:136px;height:136px}
.qr img,.qr canvas{width:120px!important;height:120px!important;display:block}
.qrbox p{margin:0;font-size:13px;color:var(--muted)}
.actions{display:grid;gap:8px}
.actions.two{grid-template-columns:1fr 1fr}
.actions.three{grid-template-columns:repeat(3,1fr)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.note b{color:var(--ink)}

form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;color:var(--ink);font-weight:500;width:100%;min-width:0}
textarea.field{min-height:110px;resize:vertical;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-weight:400;font-size:12px}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.log-item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.log-item:first-child{border-top:0}
.dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.dot.cobranca{background:var(--warn-bg);color:var(--warn)}
.dot.recibo{background:var(--ok-bg);color:var(--ok)}
.dot.comunicado,.dot.chamada,.dot.aniversario,.dot.boasvindas{background:var(--accent-soft);color:var(--accent)}
.log-item p{margin:0;font-size:14px}
.log-item small{color:var(--muted);font-size:12px}

/* Turmas */
.tgrid{display:grid;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.tcard-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tmeta{font-size:13px;color:var(--muted)}
.tstats{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.tstats b{color:var(--ink)}
.week{display:grid;gap:6px}
.wday{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.wday:first-child{border-top:0}
.wday>b{flex:none;width:38px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wday.today>b{color:var(--accent)}
.wday div{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:13px;background:var(--bg);border-radius:8px;padding:4px 8px}
.slot b{font-variant-numeric:tabular-nums}
.presence{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.presence button{border:0;background:var(--surface);padding:7px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.presence button[aria-pressed="true"].p{background:var(--ok-bg);color:var(--ok)}
.presence button[aria-pressed="true"].f{background:var(--bad-bg);color:var(--bad)}

/* Histórico do aluno */
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.month{border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);display:flex;flex-direction:column;gap:2px}
.month.ok{background:var(--ok-bg);color:var(--ok)}
.month.bad{background:var(--bad-bg);color:var(--bad)}
.month.warn{background:var(--warn-bg);color:var(--warn)}
.month small{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em}

/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:17px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .a{fill:var(--accent)} .chart .b{fill:var(--alt)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.hbar .meter{grid-column:1 / -1;margin-bottom:6px}

/* Automações */
.rule{display:flex;gap:12px;align-items:flex-start;padding:14px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .when{flex:none;width:58px;text-align:center;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:15px;border-radius:10px;padding:8px 4px;background:var(--bg)}
.rule .when small{display:block;font-family:var(--f-body);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rule .what{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rule .what span{font-size:13px;color:var(--muted)}
.switch{flex:none;width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.upcoming{display:flex;flex-direction:column}
.upday{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.upday:first-child{border-top:0}
.upday-head{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.upday-head span{color:var(--muted);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--bg);border-radius:8px;padding:3px 8px;color:var(--muted)}
.tag b{color:var(--ink);font-weight:700}

/* Escolha do tipo de negócio */
.segs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.seg svg{width:28px;height:28px;color:var(--accent)}
.seg b{font-size:15px}
.seg span{font-size:12px;color:var(--muted)}
.seg[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.plans{display:flex;flex-direction:column;gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.plan.star{border:2px solid var(--accent)}
.plan-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{font-family:var(--f-display);font-stretch:75%;font-weight:900;font-size:32px}
.price small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 8px;border-radius:999px}
.calc-out{font-family:var(--f-display);font-stretch:75%;font-weight:900;font-size:38px;color:var(--bad);line-height:1}
details.card summary{cursor:pointer;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:19px}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;align-self:flex-start;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);width:max-content;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:88%}.tgrid{grid-template-columns:1fr 1fr}.tiles.four{grid-template-columns:repeat(4,1fr)}}
@media (min-width:960px){
  .tabs{top:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .tabs .wrap{display:flex;flex-direction:column;gap:4px;padding:18px 14px;max-width:none;margin:0}
  .side-brand{display:flex;flex-direction:column;padding:4px 10px 18px}
  .side-brand b{font-family:var(--f-display);font-stretch:85%;font-weight:900;font-size:20px;color:var(--accent)}
  .side-brand span{font-size:12px;color:var(--muted)}
  .tab{flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px;justify-content:flex-start}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  .top,main.wrap{margin-left:var(--side)}
  .top .wrap,main.wrap{max-width:1080px}
  main.wrap{padding-block:26px 40px;margin-right:auto}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .toast{bottom:24px;left:calc(50% + var(--side) / 2)}
  .tgrid{grid-template-columns:repeat(3,1fr)}
  .plans{display:grid;grid-template-columns:repeat(3,1fr)}
  .segs{grid-template-columns:repeat(3,1fr)}
}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><small id="segNome">Mensalidade em Dia</small><strong id="escolaNome">Escola</strong></div>
  <button class="demo-tag" data-act="trocarSeg" title="Trocar o tipo de negócio">Demonstração</button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Seções"><div class="wrap" id="tabs"></div></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
const KEY="mensalidade-em-dia-v2";

const mesKey=d=>{d=d||now();return d.getFullYear()+"-"+pad(d.getMonth()+1)};

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n,1);
const mesNome=d=>MESES[(d||now()).getMonth()];
const ultimoDia=()=>{const d=now();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const venc=a=>Math.min(Number(a.dia)||1,ultimoDia());
const dataVenc=a=>pad(venc(a))+"/"+pad(now().getMonth()+1);

const dataCurta=d=>DIAS[d.getDay()]+", "+pad(d.getDate())+"/"+pad(d.getMonth()+1);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hashStr=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const pick=(R,arr)=>arr[Math.floor(R()*arr.length)];

/* ---------- Pix copia e cola (BR Code estático do Banco Central) ---------- */
function tlv(id,v){return id+String(v.length).padStart(2,"0")+v}
function limpa(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 .\-]/g,"").trim()}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,"0")}
function pixCode(o){
  const tx=String(o.txid||"").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"***";
  const p=tlv("00","01")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",String(o.chave).trim()))+tlv("52","0000")+tlv("53","986")
    +(o.valor?tlv("54",Number(o.valor).toFixed(2)):"")+tlv("58","BR")
    +tlv("59",(limpa(o.nome).slice(0,25)||"RECEBEDOR"))+tlv("60",(limpa(o.cidade).slice(0,15)||"SAO PAULO"))
    +tlv("62",tlv("05",tx))+"6304";
  return p+crc16(p);
}

/* ---------- dados de exemplo ---------- */
function seed(seg){
  if(!SEG[seg]) seg="futebol";
  const P=SEG[seg], R=rng(hashStr(seg)+7), hoje=now(), td=hoje.getDate(), mk=mesKey();
  const turmas=P.turmas.map((t,i)=>({id:"t"+i,nome:t[0],dias:t[1],hora:t[2],prof:t[3],valor:t[4],vagas:t[5],kids:!!t[6],chamadas:{}}));
  const alunos=[], usados={}, log=[];
  const via=()=>{const r=R();return r<.7?"Pix":r<.88?"Dinheiro":"Cartão"};
  for(let i=0;i<P.n;i++){
    const t=turmas[i%turmas.length], fem=R()<.5;
    const first=pick(R,t.kids?(fem?KF:KM):(fem?AF:AM)); let sob=pick(R,SOB), nome=first+" "+sob;
    if(usados[nome]){sob=pick(R,SOB);nome=first+" "+pick(R,SOB)+" "+sob} usados[nome]=1;
    const idade=t.kids?5+Math.floor(R()*10):19+Math.floor(R()*36);
    const nasc=new Date(hoje.getFullYear()-idade,Math.floor(R()*12),1+Math.floor(R()*28));
    const inicio=mesKey(addMonths(hoje,-Math.floor(R()*16)));
    alunos.push({id:"a"+i,nome,responsavel:t.kids?pick(R,R()<.65?AF:AM)+" "+sob:"",whats:"(11) 9"+(8000+Math.floor(R()*1999))+"-"+(1000+Math.floor(R()*8999)),
      turmaId:t.id,valor:t.valor,dia:pick(R,[5,5,10,10,10,15,15,20,25]),nasc:iso(nasc),inicio,ativo:true,pagamentos:{}});
  }
  // aniversariantes nos próximos dias e dois alunos que saíram
  [[3,2],[11,5],[20,0]].forEach(([i,d])=>{if(alunos[i]){const n=new Date(alunos[i].nasc),b=addDays(hoje,d);alunos[i].nasc=iso(new Date(n.getFullYear(),b.getMonth(),b.getDate()))}});
  alunos[P.n-1].ativo=false; alunos[P.n-6].ativo=false;
  alunos.forEach(a=>{
    for(let k=5;k>=1;k--){
      const m=addMonths(hoje,-k), key=mesKey(m);
      if(a.inicio>key) continue;
      if(!a.ativo&&k<2) continue;
      const dd=Math.max(1,Math.min(28,a.dia+Math.floor(R()*9)-3));
      a.pagamentos[key]={em:new Date(m.getFullYear(),m.getMonth(),dd,10+Math.floor(R()*9)).getTime(),via:via(),valor:a.valor,atraso:dd>a.dia};
    }
    if(!a.ativo) return;
    const v=venc(a); let pago=false;
    if(v<td) pago=R()<.76; else pago=R()<.28;
    if(pago){const dd=Math.max(1,Math.min(td-1||1,v+Math.floor(R()*5)-3));const em=new Date(hoje.getFullYear(),hoje.getMonth(),dd,9+Math.floor(R()*10),Math.floor(R()*59));
      if(em>hoje) em.setTime(hoje.getTime()-36e5);
      a.pagamentos[mk]={em:em.getTime(),via:via(),valor:a.valor,atraso:dd>v};
      log.push({ts:em.getTime()+6e4,tipo:"recibo",aluno:a.nome,txt:"Recibo automático · "+brl(a.valor)});
    } else if(v<td){
      const l=new Date(hoje.getFullYear(),hoje.getMonth(),Math.max(1,v-3),9).getTime(); log.push({ts:l,tipo:"cobranca",aluno:a.nome,txt:"Lembrete de vencimento (automático)"});
      log.push({ts:new Date(hoje.getFullYear(),hoje.getMonth(),v,9).getTime(),tipo:"cobranca",aluno:a.nome,txt:"Cobrança no vencimento (automática)"});
      if(td-v>=3) log.push({ts:new Date(hoje.getFullYear(),hoje.getMonth(),v+3,9).getTime(),tipo:"cobranca",aluno:a.nome,txt:"Cobrança de atraso (automática)"});
    }
  });
  // chamadas das últimas 3 semanas
  for(let d=1;d<=21;d++){
    const dt=addDays(hoje,-d), wd=dt.getDay();
    turmas.forEach(t=>{ if(!t.dias.includes(wd)) return; const m={};
      alunos.forEach(a=>{if(a.turmaId===t.id&&a.ativo&&a.inicio<=mesKey(dt)) m[a.id]=R()<.86}); t.chamadas[iso(dt)]=m; });
  }
  const cheia=alunos.filter(a=>a.ativo).reduce((s,a)=>s+a.valor,0), r50=v=>Math.round(v/50)*50;
  const despesas=[];
  for(let k=5;k>=0;k--){
    const key=mesKey(addMonths(hoje,-k));
    despesas.push({id:uid(),mes:key,desc:P.aluguel[0],cat:"Aluguel",valor:r50(cheia*.17)});
    despesas.push({id:uid(),mes:key,desc:"Professores",cat:"Equipe",valor:r50(cheia*.26*(0.97+R()*.06))});
    despesas.push({id:uid(),mes:key,desc:"Água e luz",cat:"Contas",valor:Math.round(cheia*(.03+R()*.015))});
    if(R()<.7) despesas.push({id:uid(),mes:key,desc:"Material e equipamentos",cat:"Material",valor:Math.round(cheia*(.015+R()*.03))});
  }
  log.push({ts:addDays(hoje,-6).setHours(15,20),tipo:"comunicado",aluno:"Todos os alunos",txt:"Comunicado: Feriado"});
  log.sort((x,y)=>y.ts-x.ts);
  return {v:2,escolhido:false,config:{segmento:seg,escola:P.escola,recebedor:P.recebedor,cidade:"São Paulo",chave:P.chave,modelos:{...MODELOS},
    auto:{lembrete:true,cobranca:true,atraso:true,ultimo:true,recibo:true,aniversario:true,boasvindas:true,falta:false}},turmas,alunos,despesas,log:log.slice(0,120)};
}

const ativos=()=>S.alunos.filter(a=>a.ativo);
const pagoMes=a=>!!(a.pagamentos&&a.pagamentos[mesKey()]);
function status(a){
  if(!a.ativo) return {k:"inativo",t:"Inativo"};
  if(pagoMes(a)) return {k:"pago",t:"Pago"};
  const hoje=now().getDate(), v=venc(a);
  if(hoje>v){const d=hoje-v;return {k:"atrasado",t:d+(d===1?" dia":" dias")+" de atraso",dias:d}}
  if(v===hoje) return {k:"vence",t:"Vence hoje",dias:0};
  if(v-hoje<=3) return {k:"vence",t:"Vence em "+(v-hoje)+(v-hoje===1?" dia":" dias"),dias:-(v-hoje)};
  return {k:"aberto",t:"Vence dia "+v,dias:-(v-hoje)};
}
function totais(){
  const r={rec:0,total:0,atr:0,atrN:0,abr:0,abrN:0,pagos:0,ativos:0,vencido:0};
  S.alunos.forEach(a=>{const p=a.pagamentos&&a.pagamentos[mesKey()];if(p)r.rec+=Number(p.valor||a.valor)});
  ativos().forEach(a=>{const s=status(a),v=Number(a.valor);r.total+=v;r.ativos++;
    if(s.k==="pago"){r.pagos++;if(venc(a)<=now().getDate())r.vencido+=v}
    else if(s.k==="atrasado"){r.atr+=v;r.atrN++;r.vencido+=v} else {r.abr+=v;r.abrN++}});
  return r;
}
function freq(a,dias){
  const t=turmaDe(a), lim=iso(addDays(now(),-(dias||30))); let tot=0,p=0;
  Object.keys(t.chamadas||{}).forEach(d=>{if(d>=lim&&a.id in t.chamadas[d]){tot++;if(t.chamadas[d][a.id])p++}});
  return tot?Math.round(p/tot*100):null;
}
function freqTurma(t){let tot=0,p=0;Object.values(t.chamadas||{}).forEach(m=>Object.values(m).forEach(v=>{tot++;if(v)p++}));return tot?Math.round(p/tot*100):null}
function niver(a,dt){if(!a.nasc)return false;const n=a.nasc.split("-");return Number(n[1])===dt.getMonth()+1&&Number(n[2])===dt.getDate()}
function idade(a){if(!a.nasc)return null;const n=new Date(a.nasc+"T12:00"),h=now();let i=h.getFullYear()-n.getFullYear();if(h<new Date(h.getFullYear(),n.getMonth(),n.getDate()))i--;return i}
function proximosEnvios(dias){
  const out=[],hoje=now(),A=S.config.auto;
  for(let d=0;d<dias;d++){
    const dt=addDays(hoje,d), day=dt.getDate(), mesmo=dt.getMonth()===hoje.getMonth(), it={};
    const add=(k,a)=>{(it[k]=it[k]||[]).push(a)};
    ativos().forEach(a=>{
      if(mesmo&&!pagoMes(a)){const v=venc(a);
        if(A.lembrete&&v-3===day)add("lembrete",a); if(A.cobranca&&v===day)add("cobranca",a);
        if(A.atraso&&v+3===day)add("atraso",a); if(A.ultimo&&v+7===day)add("ultimo",a);}
      if(A.aniversario&&niver(a,dt))add("aniversario",a);
    });
    const n=Object.values(it).reduce((s,x)=>s+x.length,0);
    if(n) out.push({dt,it,n});
  }
  return out;
}

function preenche(modelo,a,extra){

    {escola:S.config.escola,mes:mesNome(),data:pad(now().getDate())+"/"+pad(now().getMonth()+1)},extra||{});
  return String(modelo).replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m);
}

function rowAluno(a,opts){

function niceMax(v){if(v<=0)return 100;const m=v*1.1,g=Math.pow(10,Math.floor(Math.log10(m)));return Math.ceil(m/g*2)/2*g}
function chart(rows){
  const W=640,H=250,pl=96,pr=8,pt=12,pb=32,max=niceMax(Math.max(...rows.map(r=>Math.max(r.a,r.b)))),ih=H-pt-pb,bw=(W-pl-pr)/rows.length;
  let g="";
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-10}" y="${y+6}" text-anchor="end">${brlK(max*i/4)}</text>`}
  rows.forEach((r,i)=>{const x=pl+bw*i,w=Math.min(26,bw*.3),ha=ih*r.a/max,hb=ih*r.b/max,cx=x+bw/2;
    g+=`<rect class="a" x="${cx-w-2}" y="${pt+ih-ha}" width="${w}" height="${ha}" rx="3"><title>Recebido em ${r.l}: ${brl(r.a)}</title></rect>`;
    g+=`<rect class="b" x="${cx+2}" y="${pt+ih-hb}" width="${w}" height="${hb}" rx="3"><title>Despesas em ${r.l}: ${brl(r.b)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${r.l}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recebido e despesas nos últimos 6 meses">${g}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Recebido</span><span><i style="background:var(--alt)"></i>Despesas</span></div>`;
}
function serie6(){
  const rows=[];
  for(let k=5;k>=0;k--){const m=addMonths(now(),-k),key=mesKey(m);let a=0,b=0;
    S.alunos.forEach(x=>{const p=x.pagamentos&&x.pagamentos[key];if(p)a+=Number(p.valor||x.valor)});
    S.despesas.forEach(d=>{if(d.mes===key)b+=Number(d.valor)}); rows.push({l:MES3[m.getMonth()],a,b,key})}
  return rows;
}

function filtraAlunos(){
  const f=UI.filtro,q=UI.busca.toLowerCase();
  return S.alunos.filter(a=>{const s=status(a).k;
    if(f==="inativo"){if(a.ativo)return false}else if(!a.ativo)return false;
    if(f==="pago"&&s!=="pago")return false; if(f==="atrasado"&&s!=="atrasado")return false; if(f==="aberto"&&s!=="aberto"&&s!=="vence")return false;
    if(UI.turma&&a.turmaId!==UI.turma)return false;
    return !q||(a.nome+" "+a.responsavel+" "+turmaDe(a).nome).toLowerCase().includes(q)}).sort((x,y)=>x.nome.localeCompare(y.nome));
}

function copiar(texto,ok){
  const fallback=()=>{const t=document.createElement("textarea");t.value=texto;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("Não deu para copiar. Selecione o texto e copie.")}t.remove()};
  try{navigator.clipboard.writeText(texto).then(ok,fallback)}catch(e){fallback()}
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-tab],[data-aluno],[data-turma],[data-filtro],[data-act],[data-close],[data-goto],[data-tabgo]");if(!el)return;
  if(el.dataset.close&&e.target!==el&&!e.target.closest(".x"))return;
  if(el.dataset.close){closeSheet();return}
  if(el.dataset.tab){go(el.dataset.tab);return}
  if(el.dataset.tabgo){go(el.dataset.tabgo);return}
  if(el.dataset.goto){closeSheet();go("mais",el.dataset.goto);return}
  if(el.dataset.aluno){alunoSheet(byId(el.dataset.aluno));return}
  if(el.dataset.turma){turmaSheet(S.turmas.find(t=>t.id===el.dataset.turma));return}
  if(el.dataset.filtro){UI.filtro=el.dataset.filtro;render();return}
  const act=el.dataset.act, a=el.dataset.id?byId(el.dataset.id):null, tm=el.dataset.id?S.turmas.find(t=>t.id===el.dataset.id):null;
  switch(act){
    case "voltar":go("mais");break;
    case "trocarSeg":segSheet();break;
    case "escolheSeg":S=seed(el.dataset.k);S.escolhido=true;save();closeSheet();go("inicio");toast("Demonstração de "+SEG[el.dataset.k].nome.toLowerCase()+" pronta.");break;
    case "novo":formSheet();break;
    case "editar":formSheet(a);break;
    case "cobrar":cobrarSheet(a);break;
    case "lote":{const ids=ativos().filter(x=>status(x).k==="atrasado").sort((x,y)=>status(y).dias-status(x).dias).map(x=>x.id);if(ids.length)cobrarSheet(byId(ids[0]),{ids,i:0});break}
    case "proximo":{const f=UI.fila;if(f&&f.i+1<f.ids.length){f.i++;cobrarSheet(byId(f.ids[f.i]),f)}else{closeSheet();render();toast("Cobranças concluídas.")}break}
    case "enviou":registra("cobranca",a.nome,status(a).k==="atrasado"?"Cobrança de atraso enviada":"Cobrança enviada");save();break;
    case "copiar":copiar(UI.texto,()=>{registra("cobranca",a.nome,"Cobrança copiada");save();toast("Mensagem copiada. Cole no WhatsApp.")});break;
    case "simular":{pagar(a,"Pix · Mercado Pago");const f2=UI.fila;closeSheet();render();toast("Pix de "+brl(a.valor)+" recebido de "+contato(a)+". Baixa feita e recibo enviado.");
      if(f2){f2.ids=f2.ids.filter(id=>id!==a.id);if(f2.ids.length){f2.i=Math.min(f2.i,f2.ids.length-1);setTimeout(()=>cobrarSheet(byId(f2.ids[f2.i]),f2),900)}}break}
    case "pagoManual":pagar(a,el.dataset.via);closeSheet();render();toast("Pagamento de "+primeiro(a.nome)+" registrado ("+el.dataset.via.toLowerCase()+").");break;
    case "desfazer":delete a.pagamentos[mesKey()];save();closeSheet();render();toast("Pagamento desfeito.");break;
    case "inativar":a.ativo=false;save();closeSheet();render();toast(primeiro(a.nome)+" foi inativado e não será mais cobrado.");break;
    case "reativar":a.ativo=true;save();closeSheet();render();toast(primeiro(a.nome)+" voltou a ser cobrado.");break;
    case "excluir":document.getElementById("delBox").innerHTML=`<button class="btn danger block" data-act="excluirOk" data-id="${a.id}">Confirmar</button>`;break;
    case "excluirOk":S.alunos=S.alunos.filter(x=>x.id!==a.id);save();closeSheet();render();toast("Aluno excluído.");break;
    case "novaTurma":turmaForm();break;
    case "editarTurma":turmaForm(tm);break;
    case "dia":{const d=Number(el.dataset.d),i=UI.dias.indexOf(d);if(i>=0)UI.dias.splice(i,1);else UI.dias.push(d);el.setAttribute("aria-pressed",i<0);break}
    case "chamada":chamadaSheet(tm);break;
    case "pres":{UI.chamada.m[el.dataset.id]=el.dataset.v==="1";const t=S.turmas.find(x=>x.id===UI.chamada.t);document.getElementById("chBody").outerHTML=chamadaBody(alunosDa(t).sort((x,y)=>x.nome.localeCompare(y.nome)));break}
    case "salvarChamada":{const c=UI.chamada,t=S.turmas.find(x=>x.id===c.t);t.chamadas[c.d]=c.m;const falt=Object.entries(c.m).filter(([,v])=>!v).map(([id])=>byId(id));
      registra("chamada",t.nome,"Chamada: "+(falt.length?Object.keys(c.m).length-falt.length+" presentes, "+falt.length+" faltas":"todos presentes"));
      if(S.config.auto.falta)falt.forEach(x=>registra("falta",x.nome,"Aviso de falta enviado (automático)"));
      save();closeSheet();render();toast("Chamada salva."+(S.config.auto.falta&&falt.length?" "+falt.length+" aviso(s) de falta enviados.":""));break}
    case "comTurma":UI.com={txt:COMUNICADOS[0][1],para:tm.id};closeSheet();go("mais","comunicados");break;
    case "modeloCom":UI.com.txt=COMUNICADOS[Number(el.dataset.i)][1];render();break;
    case "enviarCom":{const d=destinatarios(UI.com.para);if(!d.length){toast("Nenhum contato nesse grupo.");break}
      const nome=UI.com.para==="todos"?"Todos os alunos":UI.com.para==="atrasado"?"Alunos em atraso":"Turma "+S.turmas.find(t=>t.id===UI.com.para).nome;
      registra("comunicado",nome,"Comunicado para "+d.length+" contatos");save();render();toast("Comunicado enviado para "+d.length+" contatos (simulação).");break}
    case "toggle":{const k=el.dataset.k;S.config.auto[k]=!S.config.auto[k];save();render();toast(MODELO_NOME[k].split(" (")[0]+(S.config.auto[k]?" ligado.":" desligado."));break}
    case "verModelo":modeloSheet(el.dataset.k);break;
    case "novaDespesa":despesaForm();break;
    case "delDespesa":S.despesas=S.despesas.filter(d=>d.id!==el.dataset.id);save();render();toast("Despesa excluída.");break;
    case "reset":document.getElementById("resetBox").innerHTML=`<div class="actions two"><button class="btn ghost" data-act="resetNo">Cancelar</button><button class="btn danger" data-act="resetOk">Apagar e restaurar</button></div>`;break;
    case "resetNo":render();break;
    case "resetOk":{const sg=S.config.segmento;S=seed(sg);S.escolhido=true;save();go("inicio");toast("Exemplo restaurado.");break}
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="busca"){UI.busca=e.target.value;document.getElementById("listaAlunos").innerHTML=listaAlunosHtml()}
  if(/^c(Alunos|Valor|Pct)$/.test(id))calc();
  if(id==="comTxt"&&UI.com){UI.com.txt=e.target.value;document.getElementById("comPrev").textContent=preenche(UI.com.txt,null)}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="fTurmaSel"){UI.turma=e.target.value;document.getElementById("listaAlunos").innerHTML=listaAlunosHtml()}
  if(id==="comPara"){UI.com.para=e.target.value;const n=destinatarios(UI.com.para).length;document.getElementById("comBtn").textContent="Enviar para "+n+" contatos";document.getElementById("comCount").textContent=n+" contatos"}
  if(id==="fTurma"){const o=e.target.selectedOptions[0],v=document.getElementById("fValor");if(o&&v&&!e.target.form.dataset.id)v.value=o.dataset.valor}
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target, $=id=>document.getElementById(id).value;
  if(f.id==="fAluno"){
    const id=f.dataset.id, novo=!id, a=id?byId(id):{id:uid(),pagamentos:{},ativo:true,inicio:mesKey()};
    Object.assign(a,{nome:$("fNome").trim(),responsavel:$("fResp").trim(),whats:$("fWhats").trim(),turmaId:$("fTurma"),valor:Number($("fValor")),dia:Math.max(1,Math.min(31,Number($("fDia"))||10)),nasc:$("fNasc")});
    if(novo){S.alunos.push(a);if(S.config.auto.boasvindas)registra("boasvindas",a.nome,"Boas-vindas enviada (automática)")}
    save();closeSheet();render();toast(novo?a.nome+" cadastrado."+(S.config.auto.boasvindas?" Boas-vindas enviada.":""):"Aluno atualizado.");
  }
  if(f.id==="fTurmaF"){
    if(!UI.dias.length){toast("Escolha pelo menos um dia da semana.");return}
    const id=f.dataset.id, t=id?S.turmas.find(x=>x.id===id):{id:"t"+uid(),chamadas:{},kids:false};
    Object.assign(t,{nome:$("tNome").trim(),dias:[...UI.dias].sort(),hora:$("tHora")||"18:00",prof:$("tProf").trim()||"—",valor:Number($("tValor")),vagas:Number($("tVagas"))||20});
    if(!id)S.turmas.push(t); save();closeSheet();render();toast(id?"Turma atualizada.":"Turma "+t.nome+" criada.");
  }
  if(f.id==="fDesp"){S.despesas.push({id:uid(),mes:mesKey(),desc:$("dDesc").trim(),cat:$("dCat"),valor:Number($("dValor"))});save();closeSheet();render();toast("Despesa lançada.")}
  if(f.id==="fCfg"){
    const c=S.config;c.escola=$("cfgEscola").trim()||c.escola;c.recebedor=$("cfgRecebedor").trim();c.cidade=$("cfgCidade").trim();c.chave=$("cfgChave").trim()||c.chave;
    Object.keys(MODELOS).forEach(k=>{const el=document.getElementById("mod_"+k);if(el)c.modelos[k]=el.value});
    save();render();toast("Ajustes salvos.");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$sheet.innerHTML)closeSheet()});
window.__mdia={pixCode,crc16,seed,status,proximosEnvios,get S(){return S}};
render();
if(!S.escolhido) segSheet();
})();
</script>
